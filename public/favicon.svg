<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sunDawnGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="stampBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <!-- Outer Stamp Circle -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" stroke="url(#stampBorderGrad)" stroke-width="2.5"/>

  <!-- Sunrise Horizon Background -->
  <path d="M6 34 A26 26 0 0 1 58 34 Z" fill="url(#sunDawnGrad)" opacity="0.95"/>
  <circle cx="32" cy="34" r="13" fill="#ffffff" opacity="0.3"/>
  <circle cx="32" cy="34" r="8" fill="#ffffff"/>

  <!-- Mountain / Horizon Silhouette -->
  <polygon points="6,34 18,25 28,34 38,23 58,34" fill="#1e293b" opacity="0.85"/>

  <!-- Perforated Travel Statement / Receipt Ticket -->
  <path d="M18 26 L46 26 L46 54 L42 51 L38 54 L34 51 L30 54 L26 51 L22 54 L18 51 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Statement Lines & Korean '여명' Symbol -->
  <text x="32" y="38" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="9" font-weight="900" text-anchor="middle" fill="#0f172a" letter-spacing="1">여명</text>
  <line x1="22" y1="42" x2="42" y2="42" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="23" y1="46" x2="33" y2="46" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="36" y1="46" x2="41" y2="46" stroke="#0ea5e9" stroke-width="1.2"/>
</svg>